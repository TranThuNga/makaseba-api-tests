name: API Regression Tests (makaseba)

on:
  push:
  workflow_dispatch:

jobs:
  newman-run:
    runs-on: ubuntu-latest
    steps:
      - name: Lay code ve
        uses: actions/checkout@v4

      - name: Cai Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cai Newman + reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Chay bo test API
        run: newman run makaseba.json -r cli,htmlextra --reporter-htmlextra-export report/newman-report.html

      - name: Luu bao cao HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: report/
